name: MCP Registry

# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io) as
# io.github.lookoutstats/lookout-mcp. Run it by hand after a version is live on npm: the registry checks that the npm
# package exists and names this server in its mcpName. GitHub's OIDC token proves the lookoutstats namespace: no secret.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install mcp-publisher 1.8.1 (checksum pinned)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: server.json matches package.json
        run: test "$(node -p "require('./server.json').version")" = "$(node -p "require('./package.json').version")"
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
